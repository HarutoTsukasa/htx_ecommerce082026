<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title th:text="${producto.nombre}">Producto</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
	<nav th:replace="~{fragments :: nav}"></nav>
	<div class="container pb-5">
		<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
		<div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
		<div class="row">
			<div class="col-md-5">
				<img th:if="${producto.imagen}" th:src="@{/images/{img} (img=${producto.imagen})}"
					class="img-fluid rounded" alt="${producto.imagen}">
			</div>
			<div class="col-md-7">
				<h2 th:text="${producto.nombre}"></h2>
				<p th:text="${producto.descripcion}"></p>
				<h4
					th:text="${'$ ' + {#strings.concat(#numbers.formatDecimal(producto.precio, 0, 'POINT', 0, 'POINT'))}}">
				</h4>
				<p class="text-muted" th:text="'Disponibles: ' + ${producto.cantidad}"></p>

				<form th:if="${session.usuarioId != null}" method="post" action="/carrito/agregar" class="d-flex gap-2">
					<input type="hidden" name="idProducto" th:value="${producto.idProducto}">
					<input type="number" name="cantidad" min="1" th:max="${producto.cantidad}" value="1"
						class="form-control" style="width:100px;">
					<button class="btn btn-primary" type="submit" th:disabled="${producto.cantidad == 0}">Agregar al
						carrito</button>
				</form>
				<a th:unless="${session.usuarioId != null}" href="/login" class="btn btn-outline-primary">Inicia sesión
					para comprar</a>
			</div>
		</div>
	</div>
</body>

</html>
