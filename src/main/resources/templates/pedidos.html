<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Mis pedidos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<div class="container pb-5">
  <h2>Mis pedidos</h2>
  <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>

  <table class="table" th:if="${!#lists.isEmpty(pedidos)}">
    <thead><tr><th>Número</th><th>Fecha</th><th>Total</th><th></th></tr></thead>
    <tbody>
      <tr th:each="pedido : ${pedidos}">
        <td th:text="${pedido.numero}"></td>
        <td th:text="${pedido.fechacreacion}"></td>
        <td th:text="${'$' + pedido.total}"></td>
        <td><a th:href="@{'/pedidos/' + ${pedido.idOrden}}" class="btn btn-sm btn-outline-primary">Ver</a></td>
      </tr>
    </tbody>
  </table>
  <p th:if="${#lists.isEmpty(pedidos)}" class="text-muted">Todavía no tienes pedidos.</p>
</div>
</body>
</html>
