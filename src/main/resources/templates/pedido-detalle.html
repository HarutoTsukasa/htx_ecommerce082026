<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Detalle del pedido</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<div class="container pb-5">
  <h2 th:text="'Pedido ' + ${pedido.numero}"></h2>
  <p class="text-muted" th:text="'Creado el ' + ${pedido.fechacreacion}"></p>

  <table class="table">
    <thead><tr><th>Producto</th><th>Cantidad</th><th>Precio</th><th>Subtotal</th></tr></thead>
    <tbody>
      <tr th:each="detalle : ${pedido.detalle}">
        <td th:text="${detalle.nombre}"></td>
        <td th:text="${detalle.cantidad}"></td>
        <td th:text="${'$' + detalle.precio}"></td>
        <td th:text="${'$' + detalle.total}"></td>
      </tr>
    </tbody>
  </table>
  <h4 class="text-end" th:text="'Total: $' + ${pedido.total}"></h4>

  <a href="/pedidos" class="btn btn-outline-secondary">Volver a mis pedidos</a>
</div>
</body>
</html>
