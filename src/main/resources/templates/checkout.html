<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Confirmar pedido</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<div class="container pb-5">
  <h2>Confirmar pedido</h2>
  <table class="table">
    <thead><tr><th>Producto</th><th>Cantidad</th><th>Subtotal</th></tr></thead>
    <tbody>
      <tr th:each="item : ${items}">
        <td th:text="${item.nombre}"></td>
        <td th:text="${item.cantidad}"></td>
        <td th:text="${'$' + item.subtotal}"></td>
      </tr>
    </tbody>
  </table>
  <h4 class="text-end" th:text="'Total: $' + ${total}"></h4>

  <form method="post" action="/checkout/confirmar" class="text-end">
    <a href="/carrito" class="btn btn-outline-secondary">Volver al carrito</a>
    <button class="btn btn-success" type="submit">Confirmar pedido</button>
  </form>
</div>
</body>
</html>
